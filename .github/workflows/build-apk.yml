name: Build Rage Squad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova & Build Android APK
        run: |
          npm install -g cordova
          cordova create ragesquad com.nexus.ragesquad RageSquad
          cd ragesquad
          rm -rf www/*
          cp ../index.html www/
          cordova platform add android
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: RageSquad-Game-APK
          path: ragesquad/platforms/android/app/build/outputs/apk/debug/*.apk
          
