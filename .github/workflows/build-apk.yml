name: Build Rage Squad APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mingc/android-build-box:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node & Cordova
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
          apt-get install -y nodejs
          npm install -g cordova

      - name: Build Debug APK
        run: |
          cordova create ragesquad com.nexus.ragesquad "Rage Squad"
          cd ragesquad
          rm -rf www/*
          cp ../index.html www/
          cordova platform add android
          cordova build android --debug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: RageSquad-Game-APK
          path: ragesquad/platforms/android/app/build/outputs/apk/debug/*.apk
          
